<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>船体カラーシミュレーター</title>
<script>
  // Embedded in an iframe (e.g. the product site) → hug content height instead
  // of forcing a full viewport height; the parent page measures and sizes us.
  if (window.self !== window.top) {
    document.documentElement.classList.add('is-embedded');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0E;
    --panel:#15171A;
    --panel-2:#1B1E22;
    --ink:#ECEDEF;
    --ink-dim:#9AA0A6;
    --accent:#FF6B1A;
    --blue:#5FB8FF;
    --line:rgba(236,237,239,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100dvh;
    padding:20px 16px 28px;
  }
  html.is-embedded, html.is-embedded body{ min-height:0; height:auto; }
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    width:100%;max-width:640px;margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
  }
  h2{font-size:16px;font-weight:700;margin:0 0 6px;}
  .desc{font-size:12.5px;color:var(--ink-dim);line-height:1.7;margin:0 0 16px;}
  .canvas-wrap{
    width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);
    background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    min-height:200px;
  }
  .canvas-wrap canvas{width:100%;height:auto;display:block;}
  .loading{padding:64px 0;font-size:13px;color:var(--ink-dim);}
  .actions{display:flex;align-items:center;gap:8px;margin-top:14px;}
  #resetBtn{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;letter-spacing:.03em;
    padding:8px 16px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  #resetBtn:hover{border-color:var(--accent);color:var(--accent);}
  .layers{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .layer-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;
  }
  .layer-row span{font-size:13.5px;color:var(--ink);}
  .layer-row input[type=color]{
    width:36px;height:36px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:transparent;padding:0;
  }
</style>
</head>
<body>

<div class="card">
  <h2>船体カラーシミュレーション</h2>
  <p class="desc">実機イラストをベースに、ウレタン3層のみを色替えして確認できます（フレーム・機材部分は変更されません）。カラーピッカーで色を選ぶと即座に反映されます。</p>

  <div class="canvas-wrap">
    <div class="loading" id="loadingMsg">画像を読み込み中...</div>
    <canvas id="boatCanvas" style="display:none;"></canvas>
  </div>

  <div class="actions">
    <button id="resetBtn">色をリセット</button>
  </div>

  <div class="layers" id="layerList"></div>
</div>

AAAAAAAAAAAPn4H0grtZcF1EyUAAAAAElFTkSuQmCC";

  const LAYERS = [
    { key: 3, label: '層1（最上）30mm・デッキ面', defaultColor: '#2f8fe0', refLum: 140 },
    { key: 2, label: '層2　　　40mm・グレーバンド', defaultColor: '#b7bac0', refLum: 190 },
    { key: 1, label: '層3（最下）40mm・黒バンド', defaultColor: '#1c1c1e', refLum: 32 },
  ];

  const colors = Object.fromEntries(LAYERS.map(l => [l.key, l.defaultColor]));

  const canvas = document.getElementById('boatCanvas');
  const loadingMsg = document.getElementById('loadingMsg');
  const resetBtn = document.getElementById('resetBtn');
  const layerList = document.getElementById('layerList');

  let baseData = null;
  let category = null;
  let width = 0, height = 0;
  let ready = false;

  function hexToRgb(hex){
    const v = hex.replace('#', '');
    return {
      r: parseInt(v.substring(0,2),16),
      g: parseInt(v.substring(2,4),16),
      b: parseInt(v.substring(4,6),16),
    };
  }

  function loadImage(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function render(){
    if (!baseData || !category || !canvas) return;
    const out = new Uint8ClampedArray(baseData);
    const targets = {};
    LAYERS.forEach(l => { targets[l.key] = { rgb: hexToRgb(colors[l.key]), refLum: l.refLum }; });

    for (let i = 0, p = 0; i < category.length; i++, p += 4){
      const cat = category[i];
      if (!cat) continue;
      const t = targets[cat];
      if (!t) continue;
      const r = baseData[p], g = baseData[p+1], b = baseData[p+2];
      const lum = 0.299*r + 0.587*g + 0.114*b;
      let factor = lum / t.refLum;
      factor = Math.max(0.35, Math.min(1.85, factor));
      out[p]   = Math.min(255, t.rgb.r * factor);
      out[p+1] = Math.min(255, t.rgb.g * factor);
      out[p+2] = Math.min(255, t.rgb.b * factor);
    }

    const ctx = canvas.getContext('2d');
    ctx.putImageData(new ImageData(out, width, height), 0, 0);
  }

  function buildLayerRows(){
    layerList.innerHTML = '';
    LAYERS.forEach(layer => {
      const row = document.createElement('div');
      row.className = 'layer-row';

      const span = document.createElement('span');
      span.textContent = layer.label;

      const input = document.createElement('input');
      input.type = 'color';
      input.value = colors[layer.key];
      input.addEventListener('input', (e) => {
        colors[layer.key] = e.target.value;
        render();
      });

      row.appendChild(span);
      row.appendChild(input);
      layerList.appendChild(row);
    });
  }

  resetBtn.addEventListener('click', () => {
    LAYERS.forEach(l => { colors[l.key] = l.defaultColor; });
    buildLayerRows();
    render();
  });

  Promise.all([loadImage(IMAGE_SRC), loadImage(MASK_SRC)]).then(([img, mask]) => {
    width = img.naturalWidth;
    height = img.naturalHeight;

    const off = document.createElement('canvas');
    off.width = width; off.height = height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    baseData = octx.getImageData(0, 0, width, height).data;

    const moff = document.createElement('canvas');
    moff.width = width; moff.height = height;
    const mctx = moff.getContext('2d');
    mctx.drawImage(mask, 0, 0, width, height);
    const maskData = mctx.getImageData(0, 0, width, height).data;

    category = new Uint8Array(width * height);
    for (let i = 0, p = 0; i < category.length; i++, p += 4){
      category[i] = maskData[p];
    }

    canvas.width = width;
    canvas.height = height;

    ready = true;
    loadingMsg.style.display = 'none';
    canvas.style.display = 'block';

    buildLayerRows();
    render();
  }).catch(err => {
    loadingMsg.textContent = '画像の読み込みに失敗しました。';
    console.error(err);
  });
})();
</script>

<script>
(function(){
  // Report our real content height to the parent page so it can size the
  // <iframe> exactly — avoids leftover blank space below on any screen size.
  if (window.self === window.top) return;
  function sendHeight(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    parent.postMessage({ type: 'yk-iframe-resize', height: h }, '*');
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver(sendHeight).observe(document.documentElement);
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  sendHeight();
})();
</script>
