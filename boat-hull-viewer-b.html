<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>船体カラーシミュレーター（Bパターン）</title>
<script>
  // Embedded in an iframe (e.g. the product site) → hug content height instead
  // of forcing a full viewport height; the parent page measures and sizes us.
  if (window.self !== window.top) {
    document.documentElement.classList.add('is-embedded');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0E;
    --panel:#15171A;
    --panel-2:#1B1E22;
    --ink:#ECEDEF;
    --ink-dim:#9AA0A6;
    --accent:#FF6B1A;
    --blue:#5FB8FF;
    --line:rgba(236,237,239,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100dvh;
    padding:20px 16px 28px;
  }
  html.is-embedded, html.is-embedded body{ min-height:0; height:auto; }
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    width:100%;max-width:640px;margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
  }
  h2{font-size:16px;font-weight:700;margin:0 0 6px;}
  .desc{font-size:12.5px;color:var(--ink-dim);line-height:1.7;margin:0 0 16px;}
  .canvas-wrap{
    width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);
    background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    min-height:200px;
  }
  .canvas-wrap canvas{width:100%;height:auto;display:block;}
  .loading{padding:64px 0;font-size:13px;color:var(--ink-dim);}
  .color-row{
    display:flex;align-items:center;gap:12px;margin-top:16px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;
  }
  .color-row label{font-size:13.5px;color:var(--ink);}
  .color-row input[type=color]{
    width:36px;height:36px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:transparent;padding:0;
  }
  .color-row .hex{margin-left:auto;font-size:12px;color:var(--ink-dim);}
  .presets{
    margin-top:12px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  }
  .preset-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 4px;cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;
    transition:border-color .15s;
  }
  .preset-btn:hover{border-color:var(--ink-dim);}
  .preset-btn.active{border-color:var(--accent);}
  .preset-btn .swatch{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  }
  .preset-btn .label{font-size:10px;color:var(--ink-dim);line-height:1.3;text-align:center;}
  .preset-btn.active .label{color:var(--ink);}
</style>
</head>
<body>

<div class="card">
  <h2>船体カラーシミュレーション（Bパターン）</h2>
  <p class="desc">新型ボディー（Bパターン）のイラストをベースに、船体のブルー部分のみを色替えして確認できます（黒のデッキカバー・ボトム・カーボンフレームは変更されません）。カラーピッカーまたはプリセットから選ぶと即座に反映されます。</p>

  <div class="canvas-wrap">
    <div class="loading" id="loadingMsg">画像を読み込み中...</div>
    <canvas id="boatCanvas" style="display:none;"></canvas>
  </div>

  <div class="color-row">
    <label for="colorPicker">本体カラーを選ぶ</label>
    <input type="color" id="colorPicker" value="#2E7FC4">
    <span class="hex mono" id="hexLabel">#2E7FC4</span>
  </div>

  <div class="presets" id="presetGrid"></div>
</div>

  const PRESETS = [
    { name: 'ブルー（現行）', hex: '#2E7FC4' },
    { name: 'グレー', hex: '#9AA0A6' },
    { name: 'ブラック', hex: '#444444' },
    { name: 'グリーン', hex: '#2E9B57' },
  ];

  const REF_LUM = 118; // 元画像のブルー部分の基準輝度

  const canvas = document.getElementById('boatCanvas');
  const loadingMsg = document.getElementById('loadingMsg');
  const colorPicker = document.getElementById('colorPicker');
  const hexLabel = document.getElementById('hexLabel');
  const presetGrid = document.getElementById('presetGrid');

  let baseData = null;
  let flags = null;
  let width = 0, height = 0;
  let color = '#2E7FC4';

  function hexToRgb(hex){
    const v = hex.replace('#', '');
    return {
      r: parseInt(v.substring(0,2),16),
      g: parseInt(v.substring(2,4),16),
      b: parseInt(v.substring(4,6),16),
    };
  }

  function loadImage(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function render(){
    if (!baseData || !flags || !canvas) return;
    const out = new Uint8ClampedArray(baseData);
    const t = hexToRgb(color);

    for (let i = 0, p = 0; i < flags.length; i++, p += 4){
      if (!flags[i]) continue;
      const lum = 0.299*baseData[p] + 0.587*baseData[p+1] + 0.114*baseData[p+2];
      let factor = lum / REF_LUM;
      factor = Math.max(0.30, Math.min(1.75, factor));
      out[p]   = Math.min(255, t.r * factor);
      out[p+1] = Math.min(255, t.g * factor);
      out[p+2] = Math.min(255, t.b * factor);
    }

    const ctx = canvas.getContext('2d');
    ctx.putImageData(new ImageData(out, width, height), 0, 0);
  }

  function buildPresets(){
    presetGrid.innerHTML = '';
    PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset-btn' + (p.hex.toLowerCase() === color.toLowerCase() ? ' active' : '');

      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = p.hex;

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = p.name;

      btn.appendChild(swatch);
      btn.appendChild(label);
      btn.addEventListener('click', () => setColor(p.hex));
      presetGrid.appendChild(btn);
    });
  }

  function setColor(hex){
    color = hex;
    colorPicker.value = hex;
    hexLabel.textContent = hex.toUpperCase();
    buildPresets();
    render();
  }

  colorPicker.addEventListener('input', (e) => setColor(e.target.value));

  Promise.all([loadImage(IMAGE_SRC), loadImage(MASK_SRC)]).then(([img, mask]) => {
    width = img.naturalWidth;
    height = img.naturalHeight;

    const off = document.createElement('canvas');
    off.width = width; off.height = height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    baseData = octx.getImageData(0, 0, width, height).data;

    const moff = document.createElement('canvas');
    moff.width = width; moff.height = height;
    const mctx = moff.getContext('2d');
    mctx.drawImage(mask, 0, 0, width, height);
    const maskData = mctx.getImageData(0, 0, width, height).data;

    flags = new Uint8Array(width * height);
    for (let i = 0, p = 0; i < flags.length; i++, p += 4){
      flags[i] = maskData[p] > 0 ? 1 : 0;
    }

    canvas.width = width;
    canvas.height = height;

    loadingMsg.style.display = 'none';
    canvas.style.display = 'block';

    buildPresets();
    render();
  }).catch(err => {
    loadingMsg.textContent = '画像の読み込みに失敗しました。';
    console.error(err);
  });
})();

<script>
(function(){
  // Report our real content height to the parent page so it can size the
  // <iframe> exactly — avoids leftover blank space below on any screen size.
  if (window.self === window.top) return;
  function sendHeight(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    parent.postMessage({ type: 'yk-iframe-resize', height: h }, '*');
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver(sendHeight).observe(document.documentElement);
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  sendHeight();
})();
</script>
